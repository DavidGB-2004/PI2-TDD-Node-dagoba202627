name: ci
on:
  push:
    # Ejecutar el CI cuando se haga push en estas ramas
    branches: [develop]
  pull_request:
    # Ejecutar el CI cuando se haga PR a estas ramas
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install deps (lockfile)
        run: npm ci

      - name: Run tests
        run: npm run test
